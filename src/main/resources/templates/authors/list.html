<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head :: head('Авторы')"></head>
<body class="bg-app">
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Авторы</h1>
        <a class="btn btn-primary" th:href="@{/librarian/authors/new}"><i class="bi bi-plus-lg me-1"></i>Добавить</a>
    </div>

    <div class="bg-panel p-3">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th style="width: 90px;">ID</th>
                <th>ФИО</th>
                <th style="width: 220px;"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${items}">
                <td th:text="${a.id}">1</td>
                <td th:text="${a.fullName}">Author</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-light" th:href="@{/librarian/authors/{id}/edit(id=${a.id})}">Редактировать</a>
                    <form th:action="@{/librarian/authors/{id}/delete(id=${a.id})}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
