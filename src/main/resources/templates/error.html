<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Ошибка')"></head>
<body class="bg-app">
<div th:replace="fragments/navbar :: navbar"></div>
<main class="container py-4" style="max-width: 840px;">
    <div class="bg-panel p-4">
        <h1 class="h4 mb-2">Что-то пошло не так</h1>
        <p class="text-muted mb-3">
            Код: <span th:text="${status}">500</span>,
            Ошибка: <span th:text="${error}">Error</span>
        </p>
        <div class="bg-dark p-3 rounded-4 small" style="white-space: pre-wrap;" th:text="${message}">message</div>
        <div class="mt-3">
            <a class="btn btn-outline-light" th:href="@{/}">На главную</a>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
