<!doctype html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Регистрация')"></head>
<body class="bg-app">
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container py-4" style="max-width: 520px;">
    <div class="bg-panel p-4">
        <h1 class="h4 mb-3">Регистрация</h1>

        <form th:action="@{/register}" th:object="${req}" method="post" class="vstack gap-3">
            <div>
                <label class="form-label">Email</label>
                <input th:field="*{email}" class="form-control" placeholder="email@example.com">
                <div class="text-danger small" th:errors="*{email}"></div>
            </div>

            <div>
                <label class="form-label">Пароль</label>
                <input th:field="*{password}" type="password" class="form-control" placeholder="минимум 6 символов">
                <div class="text-danger small" th:errors="*{password}"></div>
            </div>

            <div>
                <label class="form-label">Повтор пароля</label>
                <input th:field="*{confirmPassword}" type="password" class="form-control">
                <div class="text-danger small" th:errors="*{confirmPassword}"></div>
            </div>

            <button class="btn btn-primary" type="submit">Создать аккаунт</button>
            <div class="text-muted small">
                Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
            </div>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
