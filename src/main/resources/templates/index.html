<!doctype html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head :: head('Главная')"></head>
<body class="bg-app">
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container py-4">
    <div class="bg-panel p-4">
        <h1 class="h3 mb-2">Libra — мини библиотека</h1>
        <p class="text-muted mb-3">
            CRUD на 8+ таблиц (PostgreSQL) + регистрация/авторизация + 3 роли.
            Веб-страницы ходят к базе через REST API контроллеры.
        </p>

        <div sec:authorize="isAnonymous()">
            <a class="btn btn-primary me-2" th:href="@{/login}">Войти</a>
            <a class="btn btn-outline-light" th:href="@{/register}">Регистрация</a>
        </div>

        <div sec:authorize="isAuthenticated()">
            <a class="btn btn-primary" th:href="@{/dashboard}">Открыть dashboard</a>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
