<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Категория')"></head>
<body class="bg-app">
<div th:replace="fragments/navbar :: navbar"></div>
<main class="container py-4" style="max-width:720px;">
    <div class="bg-panel p-4">
        <h1 class="h4 mb-3" th:text="${item.id} == null ? 'Новая категория' : 'Редактирование категории'">Категория</h1>
        <form th:action="${item.id} == null ? @{/librarian/categories} : @{/librarian/categories/{id}(id=${item.id})}"
              th:object="${item}" method="post" class="vstack gap-3">
            <div>
                <label class="form-label">Название</label>
                <input th:field="*{name}" class="form-control" placeholder="Фантастика">
                <div class="text-danger small" th:errors="*{name}"></div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit">Сохранить</button>
                <a class="btn btn-outline-light" th:href="@{/librarian/categories}">Назад</a>
            </div>
        </form>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
