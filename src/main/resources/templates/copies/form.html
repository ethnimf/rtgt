<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Экземпляр')"></head>
<body class="bg-app">
<div th:replace="fragments/navbar :: navbar"></div>
<main class="container py-4" style="max-width: 880px;">
    <div class="bg-panel p-4">
        <h1 class="h4 mb-3" th:text="${form.id} == null ? 'Новый экземпляр' : 'Редактирование экземпляра'">Экземпляр</h1>

        <form th:action="${form.id} == null ? @{/librarian/copies} : @{/librarian/copies/{id}(id=${form.id})}"
              th:object="${form}" method="post" class="row g-3">

            <div class="col-12 col-lg-6">
                <label class="form-label">Книга</label>
                <select th:field="*{bookId}" class="form-select">
                    <option th:value="${null}" disabled selected>Выберите книгу</option>
                    <option th:each="b : ${books}" th:value="${b.id}" th:text="${b.title}"></option>
                </select>
                <div class="text-danger small" th:errors="*{bookId}"></div>
            </div>

            <div class="col-12 col-lg-6">
                <label class="form-label">Инвентарный код</label>
                <input th:field="*{inventoryCode}" class="form-control">
                <div class="text-danger small" th:errors="*{inventoryCode}"></div>
            </div>

            <div class="col-12 col-lg-6">
                <label class="form-label">Статус</label>
                <select th:field="*{status}" class="form-select">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                </select>
                <div class="text-danger small" th:errors="*{status}"></div>
            </div>

            <div class="col-12 d-flex gap-2 mt-2">
                <button class="btn btn-primary" type="submit">Сохранить</button>
                <a class="btn btn-outline-light" th:href="@{/librarian/copies}">Назад</a>
            </div>
        </form>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
