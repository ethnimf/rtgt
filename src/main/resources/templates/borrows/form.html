<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Выдача')"></head>
<body class="bg-app">
<div th:replace="fragments/navbar :: navbar"></div>
<main class="container py-4" style="max-width: 980px;">
    <div class="bg-panel p-4">
        <h1 class="h4 mb-3" th:text="${form.id} == null ? 'Новая выдача' : 'Редактирование выдачи'">Выдача</h1>

        <form th:action="${form.id} == null ? @{/librarian/borrows} : @{/librarian/borrows/{id}(id=${form.id})}"
              th:object="${form}" method="post" class="row g-3">

            <div class="col-12 col-lg-6">
                <label class="form-label">Читатель</label>
                <select th:field="*{memberId}" class="form-select">
                    <option th:value="${null}" disabled selected>Выберите читателя</option>
                    <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.fullName + ' (' + m.email + ')'}"></option>
                </select>
                <div class="text-danger small" th:errors="*{memberId}"></div>
            </div>

            <div class="col-12 col-lg-6">
                <label class="form-label">Экземпляр (инв. код)</label>
                <select th:field="*{copyId}" class="form-select">
                    <option th:value="${null}" disabled selected>Выберите экземпляр</option>
                    <option th:each="c : ${copies}" th:value="${c.id}"
                            th:text="${c.inventoryCode + ' — ' + (c.book != null ? c.book.title : '') + ' (' + c.status + ')'}"></option>
                </select>
                <div class="text-danger small" th:errors="*{copyId}"></div>
            </div>

            <div class="col-12 col-lg-4">
                <label class="form-label">Дата выдачи</label>
                <input th:field="*{borrowedAt}" type="date" class="form-control">
                <div class="text-danger small" th:errors="*{borrowedAt}"></div>
            </div>

            <div class="col-12 col-lg-4">
                <label class="form-label">Срок возврата</label>
                <input th:field="*{dueAt}" type="date" class="form-control">
                <div class="text-danger small" th:errors="*{dueAt}"></div>
            </div>

            <div class="col-12 col-lg-4">
                <label class="form-label">Дата возврата (если вернули)</label>
                <input th:field="*{returnedAt}" type="date" class="form-control">
            </div>

            <div class="col-12 d-flex gap-2 mt-2">
                <button class="btn btn-primary" type="submit">Сохранить</button>
                <a class="btn btn-outline-light" th:href="@{/librarian/borrows}">Назад</a>
            </div>
        </form>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
