<!doctype html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="navbar navbar-expand-lg navbar-dark" th:fragment="navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Libra</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
                </li>

                <li class="nav-item dropdown" sec:authorize="hasAnyRole('LIBRARIAN','ADMIN')">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-journal-bookmark me-1"></i>Каталог
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" th:href="@{/librarian/books}">Книги</a></li>
                        <li><a class="dropdown-item" th:href="@{/librarian/copies}">Экземпляры</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/librarian/authors}">Авторы</a></li>
                        <li><a class="dropdown-item" th:href="@{/librarian/categories}">Категории</a></li>
                        <li><a class="dropdown-item" th:href="@{/librarian/publishers}">Издательства</a></li>
                    </ul>
                </li>

                <li class="nav-item" sec:authorize="hasAnyRole('LIBRARIAN','ADMIN')">
                    <a class="nav-link" th:href="@{/librarian/members}"><i class="bi bi-people me-1"></i>Читатели</a>
                </li>

                <li class="nav-item" sec:authorize="hasAnyRole('LIBRARIAN','ADMIN')">
                    <a class="nav-link" th:href="@{/librarian/borrows}"><i class="bi bi-arrow-left-right me-1"></i>Выдачи</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/users}"><i class="bi bi-shield-lock me-1"></i>Пользователи</a>
                </li>

            </ul>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">Войти</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/register}">Регистрация</a>
                </li>

                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i><span sec:authentication="name">user</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-3 py-2">
                                <button class="btn btn-outline-light w-100" type="submit">Выйти</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
