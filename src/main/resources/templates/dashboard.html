<!doctype html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head :: head('Dashboard')"></head>
<body class="bg-app">
<div th:replace="fragments/navbar :: navbar"></div>

<main class="container py-4">
    <div class="row g-3">
        <div class="col-12 col-lg-8">
            <div class="bg-panel p-4">
                <h2 class="h4 mb-2">Привет, <span sec:authentication="name">user</span> 👋</h2>
                <p class="text-muted mb-0">Выбирай разделы в меню сверху. Пункты скрываются по ролям.</p>
            </div>
        </div>
        <div class="col-12 col-lg-4">
            <div class="bg-panel p-4">
                <div class="small text-muted">Тестовые данные</div>
                <div>Admin: <span class="fw-semibold">admin@local</span></div>
                <div>Пароль: <span class="fw-semibold">admin123</span></div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
