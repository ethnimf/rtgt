<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head :: head('Пользователи')"></head>
<body class="bg-app">
<div th:replace="fragments/navbar :: navbar"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Пользователи</h1>
        <div class="text-muted small">Удалять можно только тут (роль ADMIN)</div>
    </div>

    <div class="bg-panel p-3">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th style="width:90px;">ID</th>
                <th>Email</th>
                <th>Enabled</th>
                <th>Roles</th>
                <th style="width:180px;"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}">1</td>
                <td th:text="${u.email}">mail</td>
                <td th:text="${u.enabled}">true</td>
                <td>
                    <span th:each="r,st : ${u.roles}">
                        <span class="badge text-bg-secondary me-1" th:text="${r.name}">ROLE</span>
                    </span>
                </td>
                <td class="text-end">
                    <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-danger" type="submit"
                                th:disabled="${u.email == 'admin@local'}">Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
